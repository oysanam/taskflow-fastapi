<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow</title>
<style>
  :root {
    --bg:#f4f5fb; --panel:#ffffff; --text:#1e2330; --muted:#707792; --border:#e6e8f2;
    --primary:#5b5bf0; --primary-soft:#ececff; --danger:#ef4444;
    --shadow:0 6px 24px rgba(30,35,60,.07);
  }
  [data-theme="dark"] {
    --bg:#0e1118; --panel:#171b26; --text:#e8ebf5; --muted:#8a92ad; --border:#262c3d;
    --primary:#7c7cff; --primary-soft:#23264a; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body {
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text);
    min-height:100vh;
    background:linear-gradient(135deg,#c7d2fe 0%,#e9d5ff 50%,#fbcfe8 100%) fixed;
    display:flex; align-items:center; justify-content:center; padding:32px 16px;
  }
  [data-theme="dark"] body { background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 50%,#312e81 100%) fixed; }
  body::before, body::after {
    content:""; position:fixed; border-radius:50%; filter:blur(80px); opacity:.55; z-index:0; pointer-events:none;
  }
  body::before { width:420px; height:420px; background:#818cf8; top:-120px; left:-100px; }
  body::after { width:380px; height:380px; background:#f472b6; bottom:-120px; right:-80px; }
  button,input,select,textarea { font-family:inherit; font-size:14px; color:var(--text); }

  .app {
    position:relative; z-index:1; width:100%; max-width:1100px;
    display:grid; grid-template-columns:260px 1fr;
    min-height:min(760px, calc(100vh - 64px));
    border-radius:28px; overflow:hidden;
    background:rgba(255,255,255,.6); backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.6); box-shadow:0 30px 80px rgba(60,40,140,.25);
  }
  [data-theme="dark"] .app { background:rgba(23,27,38,.7); border-color:rgba(255,255,255,.08); }

  aside { background:rgba(255,255,255,.5); border-right:1px solid var(--border); padding:22px 16px; }
  [data-theme="dark"] aside { background:rgba(10,12,20,.4); }
  .logo { font-size:20px; font-weight:800; display:flex; align-items:center; gap:10px; margin:0 8px 22px; }
  .logo i { background:linear-gradient(135deg,#5b5bf0,#9b5bf0); color:#fff; width:34px; height:34px; border-radius:10px; display:grid; place-items:center; font-style:normal; }
  .section { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:22px 10px 8px; font-weight:700; }
  .nav { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:none; background:transparent; border-radius:10px; cursor:pointer; text-align:left; font-weight:600; color:var(--muted); }
  .nav:hover { background:var(--bg); }
  .nav.active { background:var(--primary-soft); color:var(--primary); }
  .nav .count { margin-left:auto; font-size:12px; background:var(--bg); padding:2px 8px; border-radius:999px; }
  .nav.active .count { background:var(--panel); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--primary); }

  main { padding:28px clamp(16px,3vw,40px); min-width:0; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .top h2 { margin:0; font-size:26px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .progress { height:8px; background:var(--border); border-radius:999px; overflow:hidden; margin-bottom:22px; }
  .progress div { height:100%; width:0; background:linear-gradient(90deg,#5b5bf0,#9b5bf0); transition:width .4s; }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); padding:16px; margin-bottom:16px; }
  .add-row { display:grid; grid-template-columns:1fr auto; gap:10px; }
  .more { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px; }
  input,select,textarea { width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--border); border-radius:10px; }
  input:focus,select:focus,textarea:focus { outline:2px solid var(--primary); border-color:transparent; }
  .btn { border:none; background:var(--primary); color:#fff; padding:10px 18px; border-radius:10px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .btn:hover { filter:brightness(1.1); }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--muted); }
  .btn.small { padding:7px 12px; font-size:13px; }

  .toolbar { display:flex; gap:10px; margin-bottom:6px; }
  .toolbar input { flex:1; }
  .toolbar select { width:auto; }

  .todo { display:flex; gap:12px; align-items:flex-start; padding:14px 6px; border-bottom:1px solid var(--border); }
  .todo:last-child { border-bottom:none; }
  .todo input[type=checkbox] { width:20px; height:20px; margin-top:2px; accent-color:var(--primary); cursor:pointer; flex:none; }
  .body { flex:1; min-width:0; }
  .title { font-weight:600; word-break:break-word; }
  .todo.done .title { text-decoration:line-through; color:var(--muted); }
  .desc { color:var(--muted); font-size:13px; margin-top:2px; word-break:break-word; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--bg); color:var(--muted); }
  .badge.high { background:#fee2e2; color:#b91c1c; } .badge.medium { background:#fef3c7; color:#b45309; } .badge.low { background:#d1fae5; color:#047857; }
  .badge.overdue { background:var(--danger); color:#fff; } .badge.cat { background:var(--primary-soft); color:var(--primary); }
  .actions { display:flex; gap:2px; opacity:.4; transition:.15s; }
  .todo:hover .actions { opacity:1; }
  .icon { background:transparent; border:none; cursor:pointer; font-size:16px; padding:6px; border-radius:8px; }
  .icon:hover { background:var(--bg); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .empty b { display:block; font-size:34px; margin-bottom:6px; }
  .hint { color:var(--muted); font-size:12px; text-align:center; margin-top:8px; }
  kbd { background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:1px 6px; font-size:11px; }

  dialog { border:none; border-radius:18px; padding:22px; width:min(460px,92vw); background:var(--panel); color:var(--text); box-shadow:0 24px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog h3 { margin:0 0 14px; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px; }
  .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }

  #toast { position:fixed; bottom:24px; left:50%; transform:translate(-50%,100px); background:#111827; color:#fff; padding:12px 20px; border-radius:10px; transition:.3s; z-index:10; }
  #toast.show { transform:translate(-50%,0); } #toast.error { background:var(--danger); }

  @media (max-width:800px) {
    body { padding:0; display:block; }
    .app { grid-template-columns:1fr; border-radius:0; min-height:100vh; }
    aside { border-right:none; border-bottom:1px solid var(--border); }
    .more { grid-template-columns:1fr 1fr; }
    .add-row { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <aside>
    <div class="logo"><i>✓</i> TaskFlow</div>
    <button class="nav active" data-view="all">📥 All tasks <span class="count" id="c-all">0</span></button>
    <button class="nav" data-view="today">☀️ Today <span class="count" id="c-today">0</span></button>
    <button class="nav" data-view="upcoming">📅 Upcoming <span class="count" id="c-upcoming">0</span></button>
    <button class="nav" data-view="overdue">⚠️ Overdue <span class="count" id="c-overdue">0</span></button>
    <button class="nav" data-view="done">✅ Completed <span class="count" id="c-done">0</span></button>
    <div class="section">Categories</div>
    <div id="cats"></div>
    <div class="section">Settings</div>
    <button class="nav" id="themeBtn">🌙 Dark mode</button>
  </aside>

  <main>
    <div class="top">
      <h2 id="viewTitle">All tasks</h2>
      <button class="btn ghost small" id="clearBtn">🧹 Clear completed</button>
    </div>
    <p class="sub" id="viewSub"></p>
    <div class="progress"><div id="bar"></div></div>

    <div class="card">
      <div class="add-row">
        <input id="title" placeholder="Add a new task...  (press N)" maxlength="200">
        <button class="btn" id="addBtn">+ Add</button>
      </div>
      <div class="more">
        <input id="description" placeholder="Details">
        <input id="category" list="catList" placeholder="Category" value="General">
        <select id="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <input type="date" id="due_date">
      </div>
      <datalist id="catList"></datalist>
    </div>

    <div class="card">
      <div class="toolbar">
        <input id="search" placeholder="🔍 Search...  (press /)">
        <select id="sort">
          <option value="newest">Newest</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </div>
      <div id="list"></div>
    </div>
    <div class="hint"><kbd>N</kbd> new task · <kbd>/</kbd> search · <kbd>Enter</kbd> add</div>
  </main>
</div>

<dialog id="editDialog">
  <h3>Edit task</h3>
  <input id="editTitle" placeholder="Title">
  <div style="height:10px"></div>
  <textarea id="editDescription" rows="3" placeholder="Details"></textarea>
  <div class="form-grid">
    <input id="editCategory" list="catList" placeholder="Category">
    <select id="editPriority">
      <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option>
    </select>
    <input type="date" id="editDue">
  </div>
  <div class="dialog-actions">
    <button class="btn ghost" id="cancelEdit">Cancel</button>
    <button class="btn" id="saveEdit">Save</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
  const API = "/todos/";
  const $ = id => document.getElementById(id);
  let todos = [];
  let view = "all";
  let category = null;
  let editingId = null;

  const VIEW_NAMES = { all:"All tasks", today:"Today", upcoming:"Upcoming", overdue:"Overdue", done:"Completed" };

  function localToday() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function toast(msg, isError=false) {
    const t = $("toast");
    t.textContent = msg;
    t.className = "show" + (isError ? " error" : "");
    setTimeout(() => t.className = "", 2400);
  }

  async function api(url, options) {
    try {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error("Request failed (" + res.status + ")");
      return res.status === 204 ? null : await res.json();
    } catch (e) {
      toast("Server error: " + e.message, true);
      throw e;
    }
  }

  const send = (method, url, data) => api(url, {
    method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
  });

  async function load() {
    todos = await api(API);
    render();
  }

  function inView(t, v, today) {
    if (v === "all") return true;
    if (v === "done") return t.done;
    if (t.done) return false;
    if (v === "today") return t.due_date === today;
    if (v === "upcoming") return t.due_date && t.due_date > today;
    if (v === "overdue") return t.due_date && t.due_date < today;
    return true;
  }

  function render() {
    const today = localToday();

    Object.keys(VIEW_NAMES).forEach(v => {
      $("c-" + v).textContent = todos.filter(t => inView(t, v, today)).length;
    });

    const cats = [...new Set(todos.map(t => t.category))].sort();
    $("cats").innerHTML = "";
    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "nav" + (category === c ? " active" : "");
      const dot = document.createElement("span"); dot.className = "dot";
      const name = document.createElement("span"); name.textContent = c;
      const count = document.createElement("span"); count.className = "count";
      count.textContent = todos.filter(t => t.category === c && !t.done).length;
      b.append(dot, name, count);
      b.onclick = () => { category = category === c ? null : c; render(); };
      $("cats").append(b);
    });
    $("catList").innerHTML = cats.concat(["General","Work","Personal","Study"].filter(x => !cats.includes(x)))
      .map(c => `<option value="${c.replace(/"/g,"&quot;")}">`).join("");

    $("viewTitle").textContent = VIEW_NAMES[view] + (category ? " · " + category : "");
    const done = todos.filter(t => t.done).length;
    const pct = todos.length ? Math.round(done / todos.length * 100) : 0;
    $("bar").style.width = pct + "%";
    $("viewSub").textContent = todos.length ? `${done} of ${todos.length} tasks completed (${pct}%)` : "No tasks yet. Add your first one below.";
    document.querySelectorAll("aside .nav[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view));

    const q = $("search").value.toLowerCase();
    let shown = todos.filter(t => inView(t, view, today)
      && (!category || t.category === category)
      && (!q || (t.title + " " + (t.description || "")).toLowerCase().includes(q)));

    const s = $("sort").value;
    const rank = { high:0, medium:1, low:2 };
    if (s === "due") shown.sort((a,b) => (a.due_date || "9999") < (b.due_date || "9999") ? -1 : 1);
    else if (s === "priority") shown.sort((a,b) => rank[a.priority] - rank[b.priority]);
    else shown.sort((a,b) => b.id - a.id);

    const list = $("list");
    list.innerHTML = "";
    if (!shown.length) {
      list.innerHTML = '<div class="empty"><b>🎉</b>Nothing here</div>';
      return;
    }

    shown.forEach(t => {
      const row = document.createElement("div");
      row.className = "todo" + (t.done ? " done" : "");

      const check = document.createElement("input");
      check.type = "checkbox"; check.checked = t.done;
      check.onchange = () => update(t.id, { done: check.checked });

      const body = document.createElement("div"); body.className = "body";
      const title = document.createElement("div"); title.className = "title"; title.textContent = t.title;
      body.append(title);
      if (t.description) {
        const d = document.createElement("div"); d.className = "desc"; d.textContent = t.description; body.append(d);
      }

      const badges = document.createElement("div"); badges.className = "badges";
      const cat = document.createElement("span"); cat.className = "badge cat"; cat.textContent = t.category;
      const pr = document.createElement("span"); pr.className = "badge " + t.priority; pr.textContent = t.priority;
      badges.append(cat, pr);
      if (t.due_date) {
        const overdue = !t.done && t.due_date < today;
        const due = document.createElement("span");
        due.className = "badge" + (overdue ? " overdue" : "");
        const label = t.due_date === today ? "Today"
          : new Date(t.due_date + "T00:00").toLocaleDateString(undefined, { day:"numeric", month:"short" });
        due.textContent = (overdue ? "Overdue · " : "📅 ") + label;
        badges.append(due);
      }
      body.append(badges);

      const actions = document.createElement("div"); actions.className = "actions";
      const edit = document.createElement("button"); edit.className = "icon"; edit.textContent = "✏️"; edit.title = "Edit";
      edit.onclick = () => openEdit(t);
      const del = document.createElement("button"); del.className = "icon"; del.textContent = "🗑️"; del.title = "Delete";
      del.onclick = () => remove(t.id);
      actions.append(edit, del);

      row.append(check, body, actions);
      list.append(row);
    });
  }

  async function add() {
    const title = $("title").value.trim();
    if (!title) return toast("Please write a title", true);
    await send("POST", API, {
      title,
      description: $("description").value || null,
      category: $("category").value.trim() || "General",
      priority: $("priority").value,
      due_date: $("due_date").value || null
    });
    ["title","description","due_date"].forEach(id => $(id).value = "");
    toast("Task added ✅");
    load();
  }

  async function update(id, data) { await send("PATCH", API + id, data); load(); }

  async function remove(id) {
    if (!confirm("Delete this task?")) return;
    await api(API + id, { method:"DELETE" });
    toast("Task deleted");
    load();
  }

  function openEdit(t) {
    editingId = t.id;
    $("editTitle").value = t.title;
    $("editDescription").value = t.description || "";
    $("editCategory").value = t.category;
    $("editPriority").value = t.priority;
    $("editDue").value = t.due_date || "";
    $("editDialog").showModal();
  }

  async function saveEdit() {
    const title = $("editTitle").value.trim();
    if (!title) return toast("Title cannot be empty", true);
    await update(editingId, {
      title,
      description: $("editDescription").value || null,
      category: $("editCategory").value.trim() || "General",
      priority: $("editPriority").value,
      due_date: $("editDue").value || null
    });
    $("editDialog").close();
    toast("Task updated ✏️");
  }

  async function clearCompleted() {
    if (!todos.some(t => t.done)) return toast("No completed tasks");
    if (!confirm("Delete all completed tasks?")) return;
    const r = await api(API + "completed", { method:"DELETE" });
    toast(r.deleted + " task(s) cleared 🧹");
    load();
  }

  $("addBtn").onclick = add;
  $("saveEdit").onclick = saveEdit;
  $("cancelEdit").onclick = () => $("editDialog").close();
  $("clearBtn").onclick = clearCompleted;
  $("search").oninput = render;
  $("sort").onchange = render;
  $("title").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  document.querySelectorAll("aside .nav[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });

  document.addEventListener("keydown", e => {
    const typing = ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
    if (typing) return;
    if (e.key === "n") { e.preventDefault(); $("title").focus(); }
    if (e.key === "/") { e.preventDefault(); $("search").focus(); }
  });

  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $("themeBtn").textContent = t === "dark" ? "☀️ Light mode" : "🌙 Dark mode";
    try { localStorage.setItem("theme", t); } catch (e) {}
  }
  $("themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

  load();
</script>
</body>
</html>
